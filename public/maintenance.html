<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JBU | Mantenimiento / Maintenance</title>
  <link rel="icon" href="/jbu-logo.svg" type="image/svg+xml">
  <style>
    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
      background: #fff;
      color: #26202d;
      font: 1rem/1.6 system-ui, sans-serif;
    }
    main {
      max-width: 32rem;
      padding: 2rem 1.25rem;
      text-align: center;
    }
    img { display: block; margin: 0 auto 2rem; }
    h1, h2 {
      margin: 0 0 0.5rem;
      color: #6929c4;
      font-size: clamp(1.375rem, 5vw, 2rem);
      line-height: 1.25;
    }
    p { margin: 0; }
    section {
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid #e8dcf9;
    }
  </style>
</head>
<body>
  <main>
    <img src="/jbu-logo.svg" alt="JBU" width="72" height="81">
    <h1>Estamos en mantenimiento.</h1>
    <p>Nuestra galería digital estará disponible nuevamente muy pronto. Gracias por tu paciencia.</p>
    <section lang="en">
      <h2>We're undergoing maintenance.</h2>
      <p>Our digital gallery will be available again shortly. Thank you for your patience.</p>
    </section>
  </main>
</body>
</html>
