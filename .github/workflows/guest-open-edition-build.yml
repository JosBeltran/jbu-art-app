name: Guest Open Edition build
on:
  pull_request:
    paths:
      - 'app/api/checkout/open-edition/**'
      - 'app/api/guest-orders/**'
      - 'app/guest-orders/**'
      - 'lib/guestOpenPrintFulfillment.server.js'
      - 'lib/emails/guestOpenPrintEmail.server.js'
      - 'app/checkout/success/page.jsx'
      - 'app/api/webhooks/stripe/route.js'
      - 'app/cart/page.jsx'
      - 'components/CartDrawer.jsx'
      - 'context/CartContext.jsx'
      - 'app/artwork/[sku]/ArtworkDetailClient.tsx'
      - '.github/workflows/guest-open-edition-build.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-for-build-only
      SUPABASE_SERVICE_ROLE_KEY: dummy-for-build-only
      STRIPE_SECRET_KEY: sk_test_dummy_for_build_only
      STRIPE_WEBHOOK_SECRET: whsec_dummy_for_build_only
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      ENABLE_GUEST_OPEN_EDITION_CHECKOUT: 'false'
      DISABLE_TRANSACTIONAL_EMAILS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # main's package-lock is already out of sync with package.json;
      # use a non-mutating install for this review-only build.
      - run: npm install --no-package-lock --no-save --no-audit --no-fund
      - run: npm run build
