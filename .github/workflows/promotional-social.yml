name: Promotional Social OG tests and build
on:
  pull_request:
    paths:
      - 'app/prints/**'
      - 'app/series/**'
      - 'app/catalog/**'
      - 'app/admin/series/**'
      - 'app/api/admin/social-sharing/**'
      - 'app/api/admin/promotional-social/**'
      - 'components/admin/**'
      - 'lib/social/promotional*'
      - 'lib/catalogData.server.js'
      - 'tests/promotionalSocial.test.mjs'
      - '.github/workflows/promotional-social.yml'
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-for-build-only
      SUPABASE_SERVICE_ROLE_KEY: dummy-for-build-only
      STRIPE_SECRET_KEY: sk_test_dummy_for_build_only
      STRIPE_WEBHOOK_SECRET: whsec_dummy_for_build-only
      NEXT_PUBLIC_SITE_URL: https://www.josuebeltranuresti.com
      ENABLE_GUEST_OPEN_EDITION_CHECKOUT: 'false'
      DISABLE_TRANSACTIONAL_EMAILS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install --no-package-lock --no-save --no-audit --no-fund
      - run: node --test tests/promotionalSocial.test.mjs
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Assert Facebook crawler receives OG tags in HTML head
        run: |
          npm run start -- -p 3100 > /tmp/next-social.log 2>&1 &
          echo $! > /tmp/next-social.pid
          trap 'kill $(cat /tmp/next-social.pid) 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl --max-time 12 -fsS -A 'facebookexternalhit/1.1' 'http://localhost:3100/prints' -o /tmp/prints-preview.html; then break; fi
            sleep 2
          done
          node --input-type=module -e "
            import fs from 'node:fs';
            const html = fs.readFileSync('/tmp/prints-preview.html', 'utf8');
            const head = html.split('</head>')[0];
            for (const tag of ['og:title', 'og:description', 'og:image', 'og:url', 'twitter:card']) {
              if (!head.includes(tag)) throw new Error('Missing crawler head metadata: ' + tag);
            }
            if (!head.includes('rel=\\\"canonical\\\"')) throw new Error('Missing canonical link');
            console.log('Facebook crawler metadata verified in head');
          "
