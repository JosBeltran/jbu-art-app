name: Promotional Social OG tests and build
on:
  pull_request:
    paths:
      - 'app/prints/**'
      - 'app/series/**'
      - 'app/catalog/**'
      - 'app/admin/series/**'
      - 'app/api/admin/social-sharing/**'
      - 'app/api/admin/promotional-social/**'
      - 'components/admin/**'
      - 'lib/social/promotional*'
      - 'lib/catalogData.server.js'
      - 'tests/promotionalSocial.test.mjs'
      - '.github/workflows/promotional-social.yml'
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:3999
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-for-build-only
      SUPABASE_SERVICE_ROLE_KEY: dummy-for-build-only
      STRIPE_SECRET_KEY: sk_test_dummy_for_build_only
      STRIPE_WEBHOOK_SECRET: whsec_dummy_for_build-only
      NEXT_PUBLIC_SITE_URL: https://www.josuebeltranuresti.com
      ENABLE_GUEST_OPEN_EDITION_CHECKOUT: 'false'
      DISABLE_TRANSACTIONAL_EMAILS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install --no-package-lock --no-save --no-audit --no-fund
      - name: Start isolated Supabase test stub
        run: |
          nohup node tests/mockSupabaseSocial.mjs > /tmp/social-mock.log 2>&1 &
          sleep 1
      - run: node --test tests/promotionalSocial.test.mjs
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Assert Meta crawler receives configured OG in actual HTML head
        run: |
          npm run start -- -p 3100 > /tmp/next-social.log 2>&1 &
          echo $! > /tmp/next-social.pid
          trap 'kill $(cat /tmp/next-social.pid) 2>/dev/null || true' EXIT
          for i in $(seq 1 15); do
            if curl --max-time 3 -fsS 'http://127.0.0.1:3100' >/dev/null; then break; fi
            sleep 1
          done
          node tests/verifyFacebookHtml.mjs
