name: Persistent supplier catalog
on:
  pull_request:
    paths:
      - 'lib/productCatalog/**'
      - 'app/admin/product-studio/**'
      - 'components/admin/productCatalog/**'
      - 'app/api/admin/product-catalog/**'
      - 'app/api/cron/supplier-catalog/**'
      - 'supabase/migrations/*supplier_catalog*.sql'
      - 'vercel.json'
      - 'tests/supplierCatalog.browser.cjs'
      - 'tests/fixtures/supplierCatalog.jsx'
      - '.github/workflows/supplier-catalog.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NEXT_FONT_GOOGLE_MOCKED_RESPONSES: ${{ github.workspace }}/tests/nextFontResponses.cjs
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-placeholder
      SUPABASE_SERVICE_ROLE_KEY: build-placeholder
      STRIPE_SECRET_KEY: sk_test_build_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install --no-package-lock --no-save --no-audit --no-fund
      - run: node --test lib/productCatalog/*.test.js
      - run: npx eslint lib/productCatalog/*.js components/admin/productCatalog/SupplierCatalogBrowser.jsx components/admin/productCatalog/StudioConfigurator.jsx app/admin/product-studio/UnifiedStudio.jsx app/api/cron/supplier-catalog/route.js tests/supplierCatalog.browser.cjs
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Install isolated browser tools
        run: |
          npm install --prefix /tmp/jbu-browser --no-package-lock --no-save esbuild@0.28.2 playwright@1.62.1
          /tmp/jbu-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify desktop/mobile catalog and exact configuration
        env:
          PLAYWRIGHT_MODULE: /tmp/jbu-browser/node_modules/playwright
          ESBUILD_MODULE: /tmp/jbu-browser/node_modules/esbuild
        run: |
          export CHROMIUM_PATH="$(node -e 'console.log(require(process.env.PLAYWRIGHT_MODULE).chromium.executablePath())')"
          node tests/supplierCatalog.browser.cjs
