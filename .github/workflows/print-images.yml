name: Print image integration checks
on:
  pull_request:
    paths:
      - 'lib/printImages.js'
      - 'lib/printImages.test.js'
      - 'lib/printMedia.server.js'
      - 'app/catalog/**'
      - 'app/prints/**'
      - 'app/series/**'
      - 'app/artwork/**'
      - 'app/admin/prints/**'
      - 'app/api/admin/prints/**'
      - 'lib/printManager*.js'
      - 'lib/printCheckoutSnapshot.server.js'
      - 'lib/guestPrintCart.js'
      - 'lib/catalogPrintAvailability.js'
      - 'app/admin/artworks/**'
      - 'context/CartContext.jsx'
      - 'app/api/checkout/**'
      - 'app/api/webhooks/stripe/route.js'
      - 'supabase/migrations/*print_variant_images.sql'
      - 'supabase/migrations/*fine_art_prints_manager.sql'
      - '.github/workflows/print-images.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-for-build-only
      SUPABASE_SERVICE_ROLE_KEY: dummy-for-build-only
      STRIPE_SECRET_KEY: sk_test_dummy_for_build_only
      STRIPE_WEBHOOK_SECRET: whsec_dummy-for-build-only
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      ENABLE_GUEST_OPEN_EDITION_CHECKOUT: 'false'
      DISABLE_TRANSACTIONAL_EMAILS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install --no-package-lock --no-save --no-audit --no-fund
      - run: node --test lib/printImages.test.js lib/printManager.test.js lib/printManager.database.test.js lib/guestPrintCart.test.js tests/catalogPrintDiscovery.test.mjs
      - run: npm run build
