name: Carbon design system audit checks
on:
  pull_request:
    paths:
      - 'app/**'
      - 'components/**'
      - 'context/**'
      - 'lib/**/*.jsx'
      - 'lib/**/*.tsx'
      - 'package.json'
      - 'package-lock.json'
      - 'docs/design-system/**'
      - 'tests/carbonDesignSystem*.test.mjs'
      - 'tests/welcomePromoLifecycle.browser.mjs'
      - 'tests/fixtures/welcomePromoLifecycle.jsx'
      - 'tools/design-system/**'
      - '.github/workflows/carbon-design-system.yml'
  workflow_dispatch:
jobs:
  source-tests-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-for-build-only
      SUPABASE_SERVICE_ROLE_KEY: dummy-for-build-only
      STRIPE_SECRET_KEY: sk_test_dummy_for_build_only
      STRIPE_WEBHOOK_SECRET: whsec_dummy_for_build_only
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      ENABLE_GUEST_OPEN_EDITION_CHECKOUT: 'false'
      DISABLE_TRANSACTIONAL_EMAILS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Full static source inventory
        run: node tools/design-system/static-audit.mjs --output=/tmp/jbu-carbon-source-audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: jbu-carbon-source-audit
          path: /tmp/jbu-carbon-source-audit.json
          retention-days: 14
      - run: npm install --no-package-lock --no-save --no-audit --no-fund
      - run: node --test tests/carbonDesignSystem*.test.mjs
      - name: Install isolated promotion browser tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/jbu-promo-browser-tools" --no-package-lock --no-save --no-audit --no-fund esbuild@0.28.2 playwright@1.62.1
          node "$RUNNER_TEMP/jbu-promo-browser-tools/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Promotion visibility lifecycle browser regression
        env:
          JBU_BROWSER_TOOLS: ${{ runner.temp }}/jbu-promo-browser-tools
          JBU_PROMO_EVIDENCE: ${{ runner.temp }}/jbu-promo-lifecycle.json
        run: node tests/welcomePromoLifecycle.browser.mjs
      - name: Upload promotion lifecycle results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jbu-promo-lifecycle
          path: ${{ runner.temp }}/jbu-promo-lifecycle.json
          if-no-files-found: warn
      - name: ESLint full repository diagnostic
        continue-on-error: true
        run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
